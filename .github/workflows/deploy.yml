name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (web/ -> dist/, preview.html served as index.html; functions/ = Pages Functions, picked up by wrangler from the repo root)
        run: |
          mkdir -p dist
          cp web/preview.html dist/index.html
          cp web/preview.html dist/preview.html
          cp web/model_web.glb dist/model_web.glb
          cp web/artworks.json dist/artworks.json
          cp web/slots.json dist/slots.json
          cp -r web/thumbs dist/thumbs
          cp -r web/video dist/video
          find dist -type f -size +25M -print -exec false {} + || { echo "::error::file exceeds Cloudflare Pages 25 MiB limit"; exit 1; }
          ls -la dist

      - name: Skip deploy (Cloudflare secrets not set yet)
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured - build OK, deploy skipped."

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cyber-louvre --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
